openapi: 3.0.3

info:
  title: TeenyMoney API
  description: 부모와 자녀가 함께 사용하는 가족 금융 서비스 API
  version: 0.4.0

servers:
  - url: /
    description: 현재 Swagger가 실행 중인 서버
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://www.teenymoney.kro.kr
    description: 운영 서버

tags:
  - name: Auth
    description: 회원가입과 인증
  - name: Members
    description: 회원 정보
  - name: Wallet
    description: 지갑 잔액과 거래내역
  - name: Health
    description: 애플리케이션과 데이터베이스 상태 확인

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: |
        이메일과 비밀번호를 검증하고 Access Token을 응답 본문으로 반환합니다.
        Refresh Token은 HttpOnly 쿠키로만 전달하고 Redis에 회원별로 저장합니다.
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: password123
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Token 쿠키
              schema:
                type: string
                example: refreshToken=token; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginApiResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "403":
          description: 비활성 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "503":
          description: Refresh Token 저장소 사용 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF 토큰 발급
      description: 로그인, 재발급, 로그아웃 전에 호출해 응답 토큰을 X-XSRF-TOKEN 헤더로 보냅니다.
      operationId: getCsrfToken
      responses:
        "200":
          description: CSRF 토큰 발급 성공
          headers:
            Set-Cookie:
              description: XSRF-TOKEN 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenApiResponse"

  /api/v1/auth/reissue:
    post:
      tags: [Auth]
      summary: Access Token 재발급
      description: Refresh Token Cookie를 검증하고 Rotation한 뒤 새 Access Token을 반환합니다.
      operationId: reissueToken
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: Rotation된 HttpOnly Refresh Token 쿠키
              schema:
                type: string
                example: refreshToken=token; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenReissueApiResponse"
        "401":
          description: Refresh Token 누락, 만료, 위조 또는 재사용
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "403":
          description: CSRF 검증 실패 또는 비활성 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "503":
          description: Refresh Token 저장소 사용 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 해당 계정의 Refresh Token과 인증 세대를 제거하고 Refresh Cookie를 만료합니다.
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          example: Bearer eyJ...
      responses:
        "200":
          description: 로그아웃 성공. 토큰이나 Redis 키가 이미 없어도 성공합니다.
          headers:
            Set-Cookie:
              description: 만료된 Refresh Token 쿠키
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidApiResponse"
        "403":
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "503":
          description: Redis 장애로 계정 토큰 삭제를 보장할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/auth/phone-verification/send:
    post:
      tags: [Auth]
      summary: 휴대폰 인증번호 발송
      description: |
        휴대폰 번호를 숫자만 남도록 정규화한 뒤 6자리 인증번호를 발송합니다.
        같은 번호의 재요청은 기본 60초 동안 제한됩니다.
        SMS 업체가 연결되기 전 운영 모드에서는 성공으로 위장하지 않고 503을 반환합니다.
      operationId: sendPhoneVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneVerificationSendRequest"
            example:
              phoneNumber: 010-1234-5678
      responses:
        "200":
          description: 인증번호 발송 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidApiResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "429":
          description: 인증번호 재요청 대기시간 미경과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
              example:
                success: false
                code: AUTH_SMS_TOO_MANY_REQUESTS
                message: 인증번호를 다시 요청하기 전에 잠시 기다려 주세요.
                data: null
        "503":
          description: SMS 발송 업체 미설정 또는 발송 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
              example:
                success: false
                code: AUTH_SMS_UNAVAILABLE
                message: 현재 문자 인증 서비스를 사용할 수 없습니다.
                data: null

  /api/v1/auth/check-email:
    get:
      tags: [Auth]
      summary: 이메일 사용 가능 여부 확인
      operationId: checkEmailAvailability
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
          example: user@example.com
      responses:
        "200":
          description: 확인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAvailabilityApiResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: |
        클라이언트는 role을 보내지 않습니다.
        서버가 생년월일을 기준으로 만 7세부터 만 18세까지는 CHILD,
        그 밖의 유효한 과거 생년월일은 PARENT로 결정합니다.
        CHILD는 teeny_score 컬럼을 생략하여 DB 기본값을 사용하고,
        PARENT는 teeny_score에 NULL을 저장합니다.
        휴대폰 인증정보는 회원 DB insert가 성공한 뒤에만 삭제됩니다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            example:
              name: 홍길동
              birthDate: "2012-03-04"
              phoneNumber: 010-1234-5678
              verificationCode: "123456"
              email: user@example.com
              password: password123
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupApiResponse"
        "400":
          description: 입력값 또는 인증번호 오류
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorApiResponse"
                  - $ref: "#/components/schemas/ErrorApiResponse"
        "409":
          description: 이메일 또는 휴대폰 번호 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "429":
          description: 인증번호 입력 횟수 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
              example:
                success: false
                code: AUTH_VERIFICATION_TOO_MANY_ATTEMPTS
                message: 인증번호 입력 횟수를 초과했습니다.
                data: null

  /api/v1/members/me:
    get:
      tags: [Members]
      summary: 내 정보 조회
      description: Access Token으로 인증된 현재 회원 정보를 조회합니다.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberMeApiResponse"
        "401":
          description: 토큰이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "403":
          description: 비활성 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

  /api/v1/wallet/me:
    get:
      tags: [Wallet]
      summary: 내 지갑 잔액과 최근 거래내역 조회
      description: Access Token으로 인증된 회원의 MEMBER 타입 지갑 잔액과,
        해당 지갑의 최근 거래내역 3건을 함께 반환합니다.
      operationId: getMyWalletDetail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetailApiResponse"

        "401":
          description: 토큰이 없거나 유효하지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"


        "404":
          description: 지갑을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
              example:
                success: false
                code: WALLET_NOT_FOUND
                message: 지갑을 찾을 수 없습니다.
                data: null

  /api/v1/health:
    get:
      tags: [Health]
      summary: 애플리케이션 상태 확인
      operationId: getApplicationHealth
      responses:
        "200":
          description: 애플리케이션 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"

  /api/v1/health/db:
    get:
      tags: [Health]
      summary: 데이터베이스 상태 확인
      operationId: getDatabaseHealth
      responses:
        "200":
          description: 데이터베이스 연결 및 SQL 실행 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthApiResponse"
        "503":
          description: 데이터베이스 연결 또는 SQL 실행 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: GET /api/v1/auth/csrf 응답의 token 값
      schema:
        type: string

  responses:
    InvalidInput:
      description: 요청값 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorApiResponse"

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          example: user@example.com
        password:
          type: string
          format: password
          maxLength: 64
          example: password123

    LoginResponse:
      type: object
      required: [accessToken, memberId, role, name]
      properties:
        accessToken:
          type: string
          description: Authorization Bearer 헤더에 사용할 Access Token
        memberId:
          type: integer
          format: int64
          example: 17
        role:
          type: string
          enum: [PARENT, CHILD]
          example: PARENT
        name:
          type: string
          example: 테스트 사용자

    CsrfTokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    TokenReissueResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Authorization Bearer 헤더에 사용할 새 Access Token

    MemberMeResponse:
      type: object
      required: [memberId, role, name, email, phoneNumber, birthDate, profileImageUrl]
      properties:
        memberId:
          type: integer
          format: int64
          example: 17
        role:
          type: string
          enum: [PARENT, CHILD]
          example: PARENT
        name:
          type: string
          example: 테스트 사용자
        email:
          type: string
          format: email
          example: user@example.com
        phoneNumber:
          type: string
          description: 하이픈 없이 정규화된 전화번호
          example: "01012345678"
        birthDate:
          type: string
          format: date
          example: "1990-01-02"
        profileImageUrl:
          type: string
          nullable: true
          example: https://example.com/profile.png

    PhoneVerificationSendRequest:
      type: object
      additionalProperties: false
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          pattern: '^01[016789]-?\d{3,4}-?\d{4}$'
          example: 010-1234-5678

    SignupRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - birthDate
        - phoneNumber
        - verificationCode
        - email
        - password
      properties:
        name:
          type: string
          maxLength: 50
          example: 홍길동
        birthDate:
          type: string
          format: date
          description: 과거 날짜, ISO YYYY-MM-DD
          example: "2012-03-04"
        phoneNumber:
          type: string
          pattern: '^01[016789]-?\d{3,4}-?\d{4}$'
          example: 010-1234-5678
        verificationCode:
          type: string
          pattern: '^\d{6}$'
          example: "123456"
        email:
          type: string
          format: email
          maxLength: 100
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'
          example: password123

    SignupResponse:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: integer
          format: int64
          example: 17

    EmailAvailabilityResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          example: true

    WalletTransaction:
      type: object
      required: [id, direction, amount, balanceAfter, description, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        direction:
          type: string
          enum: [CREDIT, DEBIT]
          example: DEBIT
        amount:
          type: integer
          format: int64
          example: 3500
        balanceAfter:
          type: integer
          format: int64
          example: 146500
        description:
          type: string
          nullable: true
          example: 편의점 결제
        createdAt:
          type: string
          example: "2026-07-31 16:15:43"


    WalletDetailResponse:
      type: object
      required: [ walletId, balance, updatedAt, recentTransactions ]
      properties:
        walletId:
          type: integer
          format: int64
          example: 5
        balance:
          type: integer
          format: int64
          example: 150000
        updatedAt:
          type: string
          nullable: true
          example: "2026-07-31 16:15:43"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"

    WalletDetailApiResponse:
      type: object
      required: [ success, code, message, data ]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/WalletDetailResponse"

    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: UP
        time:
          type: string
          example: "2026-08-03 12:00:00"

    DatabaseHealthResponse:
      type: object
      required: [database]
      properties:
        database:
          type: string
          example: teenymoney

    VoidApiResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          nullable: true
          example: null

    SignupApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/SignupResponse"

    LoginApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/LoginResponse"

    CsrfTokenApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/CsrfTokenResponse"

    TokenReissueApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/TokenReissueResponse"

    MemberMeApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/MemberMeResponse"

    EmailAvailabilityApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/EmailAvailabilityResponse"

    HealthApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/HealthResponse"

    DatabaseHealthApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: 성공
        data:
          $ref: "#/components/schemas/DatabaseHealthResponse"

    ErrorApiResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: AUTH_VERIFICATION_CODE_INVALID
        message:
          type: string
          example: 인증번호가 올바르지 않습니다.
        data:
          nullable: true
          example: null

    ValidationErrorApiResponse:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: COMMON_INVALID_INPUT
        message:
          type: string
          example: 요청 값이 올바르지 않습니다.
        data:
          type: object
          additionalProperties:
            type: string
          example:
            email: 이메일 형식이 올바르지 않습니다.
