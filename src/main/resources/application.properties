# DB 접속 정보는 실행 환경에서 반드시 주입한다.
#
#   로컬 : IDE 실행 구성 또는 셸 환경변수
#   EC2  : tomcat/bin/setenv.sh 등의 Tomcat 실행 환경
#
# DB_URL, DB_USERNAME, DB_PASSWORD가 없으면 애플리케이션이 정상 기동하지 않는다.
# 유효한 설정으로 기동한 뒤 실제 DB 연결 여부는 /api/v1/health/db에서 확인한다.

jdbc.driver=${DB_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
# requirepass가 걸린 서버(EC2)에서만 필요하다. 로컬 Redis는 비워 둔다.
redis.password=${REDIS_PASSWORD:}

# JWT
# secret은 Base64로 인코딩된 무작위 키다. 생성: openssl rand -base64 32
# 로컬과 운영 모두 JWT_SECRET 환경변수로 반드시 주입한다.
jwt.secret=${JWT_SECRET}

# 30분, 14일   (수치조정가능)
jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:1209600000}

# 쿠키
# Refresh Token 쿠키에 Secure 속성을 붙일지 결정한다.
# 로컬 HTTP는 false, 운영 HTTPS는 true를 COOKIE_SECURE 환경변수로 반드시 주입한다.
cookie.secure=${COOKIE_SECURE}

# SMS 휴대폰 인증
# 실제 SMS 업체가 연결되기 전에는 로컬에서만 test-mode=true와 6자리 test-code를 주입한다.
sms.test-mode=${SMS_TEST_MODE:false}
sms.test-code=${SMS_TEST_CODE:}
sms.verification-ttl-seconds=${SMS_VERIFICATION_TTL_SECONDS:180}
sms.resend-cooldown-seconds=${SMS_RESEND_COOLDOWN_SECONDS:60}
sms.max-attempts=${SMS_MAX_ATTEMPTS:5}

# S3 이미지 스토리지
# 버킷은 비공개다. 조회 URL은 요청마다 presign으로 발급하므로 만료 시간이 곧 URL 수명이다.
# 자격증명은 DefaultCredentialsProvider가 찾는다.
#   로컬 : AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수
#   EC2  : 인스턴스 IAM 역할 (서버에 액세스 키를 두지 않는다)
aws.region=${AWS_REGION:ap-northeast-2}
# 기본값을 두지 않는다. 값이 없으면 기동 시점에 실패하는 편이
# 엉뚱한 버킷에 조용히 쓰는 것보다 낫다.
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.presign-ttl-seconds=${AWS_S3_PRESIGN_TTL_SECONDS:600}
# [보호자 가입 흐름 6] 보호자 동의 토큰 유효시간이며 기본값은 10분이다.
legal-guardian.consent-token-ttl-seconds=${LEGAL_GUARDIAN_CONSENT_TOKEN_TTL_SECONDS:600}

# 금융감독원 금융상품통합비교공시 API
finlife.api-key=${FINLIFE_API_KEY:}
finlife.base-url=${FINLIFE_BASE_URL:https://finlife.fss.or.kr/finlifeapi}
finlife.top-fin-group-no=${FINLIFE_TOP_FIN_GROUP_NO:020000}
finlife.sync.initial-delay-ms=${FINLIFE_SYNC_INITIAL_DELAY_MS:60000}
finlife.sync.fixed-delay-ms=${FINLIFE_SYNC_FIXED_DELAY_MS:86400000}


# 토스페이먼츠 결제 수단 등록 API
toss.secret-key=${TOSS_SECRET_KEY:test_sk_24xLea5zVAEmW9gRpYBxVQAMYNwW}
toss.base-url=${TOSS_BASE_URL:https://api.tosspayments.com}

# 토스빌링키 암호화 AES-256 키 Base64로 인코딩 된 32바이트 무작위 값
charge.billing-key-encryption-key=${CHARGE_BILLING_KEY_ENCRYPTION_KEY:q7V8xJ2mN4pL9sQ3wE6rT1yU5iO8aS0dF2gH4kZ6nCw=}

# FCM
fcm.s3.key-name=${FCM_KEY}

# Dify 챗봇 AI API (LLM)
dify.api-key=${DIFY_API_KEY:}
dify.base-url=${DIFY_BASE_URL:https://api.dify.ai/v1}
dify.conversation-owner-ttl-minutes=${DIFY_CONVERSATION_OWNER_TTL_MINUTES:60}