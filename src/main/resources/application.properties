# DB \uC811\uC18D \uC815\uBCF4\uB294 \uC2E4\uD589 \uD658\uACBD\uC5D0\uC11C \uBC18\uB4DC\uC2DC \uC8FC\uC785\uD55C\uB2E4.
#
#   \uB85C\uCEEC : IDE \uC2E4\uD589 \uAD6C\uC131 \uB610\uB294 \uC178 \uD658\uACBD\uBCC0\uC218
#   EC2  : tomcat/bin/setenv.sh \uB4F1\uC758 Tomcat \uC2E4\uD589 \uD658\uACBD
#
# DB_URL, DB_USERNAME, DB_PASSWORD\uAC00 \uC5C6\uC73C\uBA74 \uC560\uD50C\uB9AC\uCF00\uC774\uC158\uC774 \uC815\uC0C1 \uAE30\uB3D9\uD558\uC9C0 \uC54A\uB294\uB2E4.
# \uC720\uD6A8\uD55C \uC124\uC815\uC73C\uB85C \uAE30\uB3D9\uD55C \uB4A4 \uC2E4\uC81C DB \uC5F0\uACB0 \uC5EC\uBD80\uB294 /api/v1/health/db\uC5D0\uC11C \uD655\uC778\uD55C\uB2E4.

jdbc.driver=${DB_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
jdbc.url=${DB_URL}
jdbc.username=${DB_USERNAME}
jdbc.password=${DB_PASSWORD}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
# requirepass\uAC00 \uAC78\uB9B0 \uC11C\uBC84(EC2)\uC5D0\uC11C\uB9CC \uD544\uC694\uD558\uB2E4. \uB85C\uCEEC Redis\uB294 \uBE44\uC6CC \uB454\uB2E4.
redis.password=${REDIS_PASSWORD:}

# JWT
# secret\uC740 Base64\uB85C \uC778\uCF54\uB529\uB41C \uBB34\uC791\uC704 \uD0A4\uB2E4. \uC0DD\uC131: openssl rand -base64 32
# \uB85C\uCEEC\uACFC \uC6B4\uC601 \uBAA8\uB450 JWT_SECRET \uD658\uACBD\uBCC0\uC218\uB85C \uBC18\uB4DC\uC2DC \uC8FC\uC785\uD55C\uB2E4.
jwt.secret=${JWT_SECRET}

# 30\uBD84, 14\uC77C   (\uC218\uCE58\uC870\uC815\uAC00\uB2A5)
jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS:1800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:1209600000}

# \uCFE0\uD0A4
# Refresh Token \uCFE0\uD0A4\uC5D0 Secure \uC18D\uC131\uC744 \uBD99\uC77C\uC9C0 \uACB0\uC815\uD55C\uB2E4.
# \uB85C\uCEEC HTTP\uB294 false, \uC6B4\uC601 HTTPS\uB294 true\uB97C COOKIE_SECURE \uD658\uACBD\uBCC0\uC218\uB85C \uBC18\uB4DC\uC2DC \uC8FC\uC785\uD55C\uB2E4.
cookie.secure=${COOKIE_SECURE}

# SMS \uD734\uB300\uD3F0 \uC778\uC99D
# \uC2E4\uC81C SMS \uC5C5\uCCB4\uAC00 \uC5F0\uACB0\uB418\uAE30 \uC804\uC5D0\uB294 \uB85C\uCEEC\uC5D0\uC11C\uB9CC test-mode=true\uC640 6\uC790\uB9AC test-code\uB97C \uC8FC\uC785\uD55C\uB2E4.
sms.test-mode=${SMS_TEST_MODE:false}
sms.test-code=${SMS_TEST_CODE:}
sms.verification-ttl-seconds=${SMS_VERIFICATION_TTL_SECONDS:180}
sms.resend-cooldown-seconds=${SMS_RESEND_COOLDOWN_SECONDS:60}
sms.max-attempts=${SMS_MAX_ATTEMPTS:5}
