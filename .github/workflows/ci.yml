name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-policy:
    name: repo-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v6

      - name: 필수 백엔드 파일 확인
        shell: bash
        run: |
          missing=0

          check_file() {
            if [ ! -s "$1" ]; then
              echo "::error title=필수 파일 누락::$1 파일이 없거나 비어 있습니다."
              missing=1
            fi
          }

          check_directory() {
            if [ ! -d "$1" ]; then
              echo "::error title=필수 폴더 누락::$1 폴더가 없습니다."
              missing=1
            fi
          }

          check_file .gitignore
          check_file build.gradle
          check_file settings.gradle
          check_file gradlew
          check_file gradlew.bat
          check_file gradle/wrapper/gradle-wrapper.jar
          check_file gradle/wrapper/gradle-wrapper.properties
          check_file src/main/resources/application.properties
          check_file sql/README.md
          check_file .github/pull_request_template.md
          check_directory .github/ISSUE_TEMPLATE

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: 민감 파일 커밋 방지
        shell: bash
        run: |
          tracked_sensitive_files="$(
            git ls-files |
              grep -E '(^|/)\.idea/|(^|/)\.env($|\.)|(^|/)application-local\.properties$|\.(pem|key|p12|pfx|jks|keystore)$' |
              grep -v -E '(^|/)\.env\.example$' || true
          )"

          if [ -n "$tracked_sensitive_files" ]; then
            echo "::error title=민감 파일 커밋 감지::환경 파일, IDE 설정 또는 인증서 파일이 Git에 포함되어 있습니다."
            echo "$tracked_sensitive_files"
            exit 1
          fi

      - name: DB 자격증명 환경변수 사용 확인
        shell: bash
        run: |
          properties=src/main/resources/application.properties
          invalid=0

          check_property() {
            if ! grep -Fqx "$1" "$properties"; then
              echo "::error title=DB 설정 오류::$properties 에 '$1' 설정이 필요합니다."
              invalid=1
            fi
          }

          check_property 'jdbc.url=${DB_URL}'
          check_property 'jdbc.username=${DB_USERNAME}'
          check_property 'jdbc.password=${DB_PASSWORD}'

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v6

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설정 및 Wrapper 검증
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Gradle Wrapper 실행 권한 설정
        run: chmod +x gradlew

      - name: 테스트 및 WAR 빌드
        run: ./gradlew clean build --no-daemon

      - name: WAR 생성 확인
        run: test -s build/libs/ROOT.war

      - name: 실패한 테스트 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: WAR 파일 업로드
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: teenymoney-backend-${{ github.sha }}
          path: build/libs/ROOT.war
          if-no-files-found: error
          retention-days: 7
