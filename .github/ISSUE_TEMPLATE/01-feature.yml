name: 기능 개발
description: 사용자에게 새로운 기능, API 또는 화면을 제공하는 작업입니다.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        ### 작성 안내
        이슈 제목에는 `[BE]`, `[FE]`, `[Feature]` 등의 접두어 없이 실제 작업 내용만 작성합니다.
        이슈 생성 후 우측 Fields와 Labels에서 구조화된 메타데이터를 설정합니다.

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 왜 필요한 기능인지 작성해주세요.
      placeholder: 해결하려는 문제와 기능이 필요한 배경을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: user-business-value
    attributes:
      label: 사용자·비즈니스 가치
      description: 사용자가 어떤 문제를 해결하거나 어떤 가치를 얻는지 작성해주세요.
      placeholder: 사용자와 비즈니스 관점에서 기대하는 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: implementation-scope
    attributes:
      label: 구현 범위
      description: 이번 이슈에서 구현할 항목을 체크리스트 형태로 작성해주세요.
      placeholder: |
        - [ ] 구현 항목 1
        - [ ] 구현 항목 2
    validations:
      required: true

  - type: textarea
    id: excluded-scope
    attributes:
      label: 제외 범위
      description: 이번 이슈에서 다루지 않는 기능이나 작업을 작성해주세요.
      placeholder: 후속 이슈에서 처리하거나 이번 범위에서 제외할 내용을 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: impact-scope
    attributes:
      label: 영향 범위
      description: 변경 또는 연동되는 API, DB, 화면, 인증, 외부 시스템 등을 작성해주세요.
      placeholder: 영향을 받는 기능과 연동 지점을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업 및 의존성
      description: 선행 이슈, 확정이 필요한 API·DB 설계, 외부 의존성을 작성해주세요.
      placeholder: 관련 이슈 번호, 설계 결정 또는 외부 의존성을 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 구현 완료를 판단할 수 있는 검증 가능한 조건을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 완료 조건 1
        - [ ] 완료 조건 2
    validations:
      required: true

  - type: textarea
    id: test-demo-method
    attributes:
      label: 테스트·시연 방법
      description: API, MockMvc, Postman, Swagger, 브라우저 또는 통합 시연 등의 확인 방법을 작성해주세요.
      placeholder: 실행할 테스트와 정상 결과를 확인하는 방법을 작성해주세요.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 이슈 생성 후 확인할 항목
        - [ ] Assignee 지정
        - [ ] Priority 지정
        - [ ] Effort 지정
        - [ ] 필요한 경우 Start date와 Target date 지정
        - [ ] 업무 기능에 맞는 `domain:*` Label 지정
        - [ ] 기술 작업 영역에 맞는 `area:*` Label 지정
        - [ ] 상위 작업이 있다면 Parent issue 연결
        - [ ] 진행할 수 없는 상태라면 `status: blocked` Label 지정
