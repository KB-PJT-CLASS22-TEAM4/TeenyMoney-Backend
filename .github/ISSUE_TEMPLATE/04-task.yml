name: 일반 작업
description: 기능을 완성하기 위한 세부 구현, 테스트, 문서, 설정 및 협업 환경 관련 작업입니다.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        ### 작성 안내
        이슈 제목에는 `[BE]`, `[FE]`, `[Task]` 등의 접두어 없이 실제 작업 내용만 작성합니다.
        이슈 생성 후 우측 Fields와 Labels에서 구조화된 메타데이터를 설정합니다.

  - type: dropdown
    id: task-category
    attributes:
      label: 작업 분류
      description: 이번 이슈의 작업 성격을 선택해주세요.
      options:
        - 일반 구현
        - 테스트
        - 문서
        - 개발 환경·설정
        - GitHub 협업
        - 배포 준비
        - 데이터 준비
        - 기타
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 이 작업이 필요한 이유를 작성해주세요.
      placeholder: 해결할 문제와 기대 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: task-details
    attributes:
      label: 작업 내용
      description: 수행할 작업을 체크리스트 형태로 작성해주세요.
      placeholder: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 산출물
      description: 생성 또는 변경되는 코드, 문서, 설정 파일 등을 작성해주세요.
      placeholder: 예상되는 파일, 문서 또는 설정 변경을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 선행 조건 및 의존성
      description: 작업 전에 완료되어야 할 조건과 의존성을 작성해주세요.
      placeholder: 선행 이슈, 외부 의존성 또는 필요한 결정을 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 작업 완료를 판단할 수 있는 검증 가능한 조건을 작성해주세요.
      placeholder: 완료로 판단할 기준을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: verification-method
    attributes:
      label: 확인 방법
      description: 산출물과 완료 조건을 확인하는 방법을 작성해주세요.
      placeholder: 실행할 테스트, 빌드 또는 문서 검토 방법을 작성해주세요.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Issue Type 안내
        - 테스트만을 목적으로 하는 독립 이슈라면 생성 후 Issue Type을 `Test`로 변경합니다.
        - 문서만 변경하는 이슈라면 생성 후 Issue Type을 `Docs`로 변경합니다.
        - 환경, 의존성, 빌드, GitHub 설정 작업이라면 생성 후 Issue Type을 `Chore`로 변경합니다.

        ### 이슈 생성 후 확인할 항목
        - [ ] Assignee 지정
        - [ ] Priority 지정
        - [ ] Effort 지정
        - [ ] 필요한 경우 Start date와 Target date 지정
        - [ ] 업무 기능에 맞는 `domain:*` Label 지정
        - [ ] 기술 작업 영역에 맞는 `area:*` Label 지정
        - [ ] 상위 작업이 있다면 Parent issue 연결
        - [ ] 진행할 수 없는 상태라면 `status: blocked` Label 지정
