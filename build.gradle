plugins {
    id 'java'
    id 'war'
}

group 'com.teenyfin.teenymoney'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    springVersion = '5.3.37'
    springSecurityVersion = '5.8.16'   // javax 기반 마지막 라인. 6.x는 jakarta라 못 씀
    springDataRedisVersion = '2.7.18'  // 3.x는 Spring 6 전용
    lombokVersion = '1.18.30'
    jjwtVersion = '0.12.6'
    jacksonVersion = '2.15.4'
    log4jVersion = '2.18.0'
    swaggerUiVersion = '5.31.0'
    awsSdkVersion = '2.46.7'           // v1(aws-java-sdk-s3)은 유지보수 종료라 쓰지 않는다
}

// JAVA_HOME과 무관하게 JDK 17로 컴파일한다.
// Gradle이 설치된 JDK 중 17을 찾아 쓰므로 팀원별 JAVA_HOME 설정이 필요 없다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// WAR 파일명 = 톰캣 컨텍스트 경로.
// ROOT.war로 고정해야 API가 /api/v1/... 로 붙는다. 버전을 올려도 경로가 안 바뀐다.
war {
    archiveFileName = 'ROOT.war'
}

dependencies {

    // AWS S3 - 프로필/인증사진 이미지 저장 (비공개 버킷)
    // BOM을 쓰면 s3와 그 안에 들어 있는 presigner의 버전이 어긋나지 않는다.
    //
    // netty-nio-client는 S3AsyncClient용 비동기 HTTP 클라이언트다. 우리는 동기 S3Client와
    // 서명만 하는 S3Presigner만 쓰므로 제외한다(WAR 4MB 감소).
    // 나중에 S3AsyncClient가 필요해지면 이 exclude를 지운다.
    // Lettuce가 쓰는 netty는 별도 의존성이라 영향받지 않는다.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation("software.amazon.awssdk:s3")
            { exclude group: 'software.amazon.awssdk', module: 'netty-nio-client' }

    // Swagger
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    // Jackson - JSON 직렬화
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    // LocalDate를 "1985-03-01" 문자열로 주고받기 위해 필요하다.
    // 없으면 Jackson이 [1985,3,1] 배열로 직렬화하고, 요청 쪽은 역직렬화에 실패한다.
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // 데이터베이스
    implementation 'com.mysql:mysql-connector-j:8.1.0'
    implementation 'com.zaxxer:HikariCP:2.7.4'

    // DB myBatis
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation 'org.mybatis:mybatis:3.4.6'
    implementation 'org.mybatis:mybatis-spring:1.3.2'

    // 스프링
    implementation ("org.springframework:spring-context:${springVersion}")
            { exclude group: 'commons-logging', module: 'commons-logging' }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    // Spring Security
    // 빈은 RootConfig에 등록하고 WebConfig에 DelegatingFilterProxy를 붙인다.
    // ServletConfig(자식 컨텍스트)에 두면 필터 등록 시점이 어긋난다.
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"

    // Redis - Refresh Token, 가족 연동코드(10분 만료)
    // spring-data-redis는 lettuce를 optional로 선언하므로 직접 넣어야 한다.
    implementation "org.springframework.data:spring-data-redis:${springDataRedisVersion}"
    implementation 'io.lettuce:lettuce-core:6.1.10.RELEASE'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Bean Validation (@NotNull 등) - 구현체가 없으면 @Valid가 조용히 무시된다
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.glassfish:jakarta.el:3.0.4'

    // AOP
    implementation 'org.aspectj:aspectjrt:1.9.20'
    implementation 'org.aspectj:aspectjweaver:1.9.20'

    // Servlet
    compileOnly('javax.servlet:javax.servlet-api:4.0.1')

    // Log4j2 Logging
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"

    // log4jdbc
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'

    // xml내 한글 처리
    implementation 'xerces:xercesImpl:2.12.2'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // 테스트
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.springframework.security:spring-security-test:${springSecurityVersion}"
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    // Mockito.mock()을 직접 호출한다. @ExtendWith용 mockito-junit-jupiter는 넣지 않는다.
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()

    // 테스트가 무엇을 기대했고 실제로 무엇이 나왔는지 콘솔에 남긴다.
    // 이게 없으면 @DisplayName도 println도 출력되지 않아 초록불만 보인다.
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
        displayGranularity = 2
    }
}
